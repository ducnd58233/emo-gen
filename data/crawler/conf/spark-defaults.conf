# Default Spark configuration

# Performance settings
spark.driver.memory                 2g
spark.executor.memory               2g
spark.driver.maxResultSize          1g

# Python dependencies
spark.pyspark.python                python
spark.pyspark.driver.python         python

# Include project paths in Python path for all workers
spark.executorEnv.PYTHONPATH        ./src
spark.driver.extraClassPath         ./src

# Module shipping configuration
spark.submit.pyFiles                ./src

# Network settings
spark.network.timeout               800s
spark.executor.heartbeatInterval    60s

# Memory settings
spark.memory.fraction               0.8
spark.memory.storageFraction        0.3

# Serialization
spark.serializer                    org.apache.spark.serializer.KryoSerializer